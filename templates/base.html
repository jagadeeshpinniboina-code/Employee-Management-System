<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <title>
        {% block title %}
        	
        {% endblock %}
    </title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


      <style>
          #create_form{
              margin-bottom: 100px;
              margin-top: 100px;
              background-color: greenyellow;
              padding:30px;
              border: 5px dashed red;

          }
          #create_form label{
              color:red;
              font-weight: bold;
              font-size: 20px;
          }
          #id_footer{
              background-color: black;
              color:White;
              text-align: center;
              padding:10px;
              position:fixed;
              bottom:0;
              left:0;
              width:100%;
          }
          .about-box {
              width: 80%;
              margin: 30px auto;
              padding: 25px;
              border: 2px solid #333;
              border-radius: 8px;
              background-color: #f8f9fa;
          }
          .about-box p {
              margin: 0;
              line-height: 1.6;
          }
          .vision:hover{
              transform: translateY(-5px);
          }
          hr{
              border: 5px solid red;
          }
      </style>

</head>

<body>
     {% include 'manubar.html' %}
     <div class="container">
         {% block body %}

         {% endblock %}
     </div>
     {% include 'footer.html' %}

</body>
</html>
