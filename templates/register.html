{% extends 'base.html' %}

{% load crispy_forms_filters %}

{% block title %}
	Register-page
{% endblock %}

{% block body %}
	{% if form %}
        <form method="POST" id="create_form">
            {% csrf_token %}
            {{ form|crispy }}
            <div>
                <input type="submit" value="Register" class="btn btn-primary">
            </div>
        </form>
    {% else %}
        <h1>Form not found</h1>

    {% endif %}
{% endblock %}
